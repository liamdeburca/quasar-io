[build-system]
requires = [
    "wheel", 
    "setuptools==72.1.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-io"
authors = [{name = "Liam", email = "liam_deburca@me.com"}]
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "quasar-decrypt==0.1.0",
    
    "pydantic==2.12",
    "astropy==7.0",
    "numpy==1.26",
    "scipy==1.16",
    "lazy-imports==1.2.0",
    "h5py==3.16.0",
]

[project.optional-dependencies]
yaml = ["pyyaml==6.0.2"]
toml = ["toml==0.10.2"]
toon = ["toons==0.9.0"]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.10.1",
    "isort==9.0.2",
    "quasar-io[yaml, toml, toon]",
]

[project.urls]
Homepage = "https://github.com/liamdeburca/quasar-io"
Repository = "https://github.com/liamdeburca/quasar-io.git"
"Bug Tracker" = "https://github.com/liamdeburca/quasar-io/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79

[lint.pyupgrade]
keep-runtime-typing = true